<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Guía de Restaurantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-orange-50 to-amber-50 min-h-screen py-8 px-4">
    
    <div class="max-w-4xl mx-auto">
        <button onclick="history.back()" class="mb-6 flex items-center gap-2 text-gray-700 hover:text-gray-900">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Volver
        </button>

        <div id="empty-cart" class="hidden bg-white rounded-lg shadow-lg p-8 text-center">
            <p class="text-gray-600 mb-4">Tu carrito está vacío</p>
            <button onclick="window.location.href='index.html'" 
                    class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg">
                Volver al inicio
            </button>
        </div>

        <div id="checkout-content" class="grid md:grid-cols-2 gap-6">
            <!-- Formulario -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-bold mb-6">Datos de Entrega</h2>
                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label class="flex items-center gap-2 text-sm font-medium mb-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            Nombre completo *
                        </label>
                        <input type="text" id="name" required 
                               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                               placeholder="Juan Pérez">
                    </div>

                    <div>
                        <label class="flex items-center gap-2 text-sm font-medium mb-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                            Teléfono *
                        </label>
                        <input type="tel" id="phone" required 
                               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                               placeholder="78901234">
                    </div>

                    <div>
                        <label class="flex items-center gap-2 text-sm font-medium mb-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            </svg>
                            Dirección de entrega *
                        </label>
                        <textarea id="address" required rows="3"
                                  class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                                  placeholder="Calle, número, zona"></textarea>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-2 block">Referencia</label>
                        <input type="text" id="reference" 
                               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                               placeholder="Cerca de...">
                    </div>

                    <div>
                        <label class="flex items-center gap-2 text-sm font-medium mb-3">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                            </svg>
                            Método de pago *
                        </label>
                        <div class="space-y-2">
                            <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-orange-50">
                                <input type="radio" name="payment" value="cash" checked class="mr-3">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                </svg>
                                Efectivo al recibir
                            </label>
                            <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-orange-50">
                                <input type="radio" name="payment" value="qr" class="mr-3">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                                </svg>
                                Pago con QR
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-2 block">Notas adicionales</label>
                        <textarea id="notes" rows="3"
                                  class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                                  placeholder="Instrucciones especiales..."></textarea>
                    </div>

                    <button type="submit" 
                            class="w-full h-12 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white text-lg font-semibold rounded-lg">
                        Confirmar Pedido por WhatsApp
                    </button>
                </form>
            </div>

            <!-- Resumen del pedido -->
            <div class="space-y-4">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-2xl font-bold mb-2">Resumen del Pedido</h2>
                    <p id="restaurant-name" class="text-sm text-gray-600 mb-4"></p>
                    
                    <div id="cart-items" class="space-y-3 mb-4">
                        <!-- Los items se cargarán aquí -->
                    </div>

                    <div class="pt-3 border-t">
                        <div class="flex justify-between items-center text-xl font-bold">
                            <span>Total:</span>
                            <span id="total-amount" class="text-orange-600">0.00 Bs</span>
                        </div>
                    </div>
                </div>

                <div class="bg-gradient-to-r from-orange-50 to-amber-50 rounded-lg shadow p-4">
                    <p class="text-sm text-gray-700">
                        <strong>Nota:</strong> Al confirmar, se abrirá WhatsApp con tu pedido listo para enviar al restaurante.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
