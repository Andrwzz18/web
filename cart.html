<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Guía de Restaurantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-orange-50 to-amber-50 min-h-screen py-8 px-4">
    
    <div class="max-w-4xl mx-auto">
        <button onclick="history.back()" class="mb-6 flex items-center gap-2 text-gray-700 hover:text-gray-900">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Volver
        </button>

        <div id="empty-cart" class="hidden bg-white rounded-lg shadow-lg p-8 text-center">
            <svg class="w-24 h-24 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <p class="text-gray-600 mb-4 text-xl">Tu carrito está vacío</p>
            <button onclick="window.location.href='index.html'" 
                    class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-semibold">
                Explorar Restaurantes
            </button>
        </div>

        <div id="cart-content" class="space-y-6">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Mi Carrito</h1>
                <p id="restaurant-name" class="text-gray-600"></p>
            </div>

            <!-- Items del carrito -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">Platos Seleccionados</h2>
                <div id="cart-items" class="space-y-4">
                    <!-- Los items se cargarán aquí -->
                </div>
            </div>

            <!-- Total y botones -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center text-2xl font-bold mb-6">
                    <span>Total:</span>
                    <span id="total-amount" class="text-orange-600">0.00 Bs</span>
                </div>

                <div class="space-y-3">
                    <button onclick="window.location.href='checkout.html'" 
                            class="w-full h-12 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white text-lg font-semibold rounded-lg">
                        Proceder al Checkout
                    </button>
                    <button onclick="continueShopping()" 
                            class="w-full h-12 bg-gray-200 hover:bg-gray-300 text-gray-800 text-lg font-semibold rounded-lg">
                        Seguir Comprando
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (cart.items.length === 0) {
                document.getElementById('empty-cart').classList.remove('hidden');
                document.getElementById('cart-content').classList.add('hidden');
                return;
            }

            loadCartItems();
        });

        function loadCartItems() {
            const restaurantName = document.getElementById('restaurant-name');
            const cartItems = document.getElementById('cart-items');
            const totalAmount = document.getElementById('total-amount');

            if (cart.currentRestaurant) {
                restaurantName.textContent = `Pedido de: ${cart.currentRestaurant.name}`;
            }

            cartItems.innerHTML = '';

            cart.items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center gap-4 p-4 bg-gradient-to-r from-orange-50 to-amber-50 rounded-lg';
                
                const price = typeof item.price === 'string' 
                    ? parseFloat(item.price.split('/')[0]) 
                    : item.price;
                
                itemDiv.innerHTML = `
                    <div class="flex-1">
                        <h3 class="font-semibold text-lg text-gray-800">${item.name}</h3>
                        <p class="text-gray-600">${price} Bs c/u</p>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button onclick="changeQuantity('${item.name}', -1)" 
                                class="w-8 h-8 flex items-center justify-center bg-white hover:bg-gray-100 rounded-lg border-2 border-orange-300 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                            </svg>
                        </button>
                        
                        <span class="font-bold text-xl text-gray-800 w-12 text-center">${item.quantity}</span>
                        
                        <button onclick="changeQuantity('${item.name}', 1)" 
                                class="w-8 h-8 flex items-center justify-center bg-white hover:bg-gray-100 rounded-lg border-2 border-orange-300 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="text-right">
                        <p class="font-bold text-xl text-gray-800">${(price * item.quantity).toFixed(2)} Bs</p>
                    </div>
                    
                    <button onclick="removeItem('${item.name}')" 
                            class="w-10 h-10 flex items-center justify-center text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                `;
                
                cartItems.appendChild(itemDiv);
            });

            totalAmount.textContent = cart.getTotal().toFixed(2) + ' Bs';
        }

        function changeQuantity(dishName, change) {
            const item = cart.items.find(i => i.name === dishName);
            if (item) {
                const newQuantity = item.quantity + change;
                cart.updateQuantity(dishName, newQuantity);
                loadCartItems();
            }
        }

        function removeItem(dishName) {
            if (confirm('¿Eliminar este plato del carrito?')) {
                cart.removeFromCart(dishName);
                
                if (cart.items.length === 0) {
                    document.getElementById('empty-cart').classList.remove('hidden');
                    document.getElementById('cart-content').classList.add('hidden');
                } else {
                    loadCartItems();
                }
            }
        }

        function continueShopping() {
            if (cart.currentRestaurant) {
                // Volver a la página del restaurante actual
                const province = provincesData.find(p => 
                    p.restaurants.some(r => r.id === cart.currentRestaurant.id)
                );
                if (province) {
                    window.location.href = `province.html?id=${province.id}`;
                    return;
                }
            }
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
